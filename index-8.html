<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sociafeed</title>
<meta name="theme-color" content="#1d5fd1">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Sociafeed">
<style>
:root{--bg:#eef1f6;--card:#fff;--text:#1a1f2b;--muted:#64708a;--accent:#1d5fd1;--line:#dde3ee;--like:#e0245e;box-sizing:border-box}
@media (prefers-color-scheme:dark){:root{--bg:#12151c;--card:#1c212b;--text:#e8ecf4;--muted:#9aa5bd;--accent:#5b9bff;--line:#2c3443;--like:#ff6b95}}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:calc(64px + env(safe-area-inset-bottom,0px))}
.bar{position:sticky;top:0;z-index:5;background:var(--accent);color:#fff;font-size:22px;font-weight:800;padding:calc(12px + env(safe-area-inset-top,0px)) 16px 12px}
.wrap{max-width:620px;margin:0 auto;padding:12px}
.card{background:var(--card);border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.12)}
textarea,input{width:100%;font:inherit;font-size:16px;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
textarea{resize:none;min-height:72px}
button{font:inherit;border:0;border-radius:10px;padding:9px 14px;background:var(--accent);color:#fff;cursor:pointer}
button.ghost{background:none;color:var(--muted)}
button:disabled{opacity:.5}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.row{display:flex;gap:8px;align-items:center}
.right{justify-content:flex-end;margin-top:8px}
.avatar{width:40px;height:40px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;flex:none}
img.avatar{object-fit:cover;background:var(--line)}
.bar{display:flex;justify-content:space-between;align-items:center}
#bell{background:none;color:#fff;font-size:20px;padding:4px 8px;position:relative}
#bell b{position:absolute;top:-4px;right:-2px;background:#e0245e;color:#fff;font-size:11px;border-radius:10px;padding:1px 6px}
.bio{font-size:14px;color:var(--muted);margin-top:4px;word-break:break-word}
#chat{position:fixed;inset:0;z-index:30;background:var(--bg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
#chat .chh,#chat .chf{padding:8px 12px;background:var(--card)}
#chat .chf{padding-bottom:calc(8px + env(safe-area-inset-bottom,0px))}
#msgs{flex:1;overflow-y:auto;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.msg{max-width:78%;padding:8px 12px;border-radius:16px;background:var(--card);word-break:break-word;white-space:pre-wrap;align-self:flex-start}
.msg.me{align-self:flex-end;background:var(--accent);color:#fff}
.msg img,.msg video{max-width:100%;border-radius:10px;display:block}
.name{font-weight:700}.time{font-size:12px;color:var(--muted)}
.text{margin:10px 0;white-space:pre-wrap;word-break:break-word}
.actions{display:flex;border-top:1px solid var(--line);padding-top:6px;margin-top:6px}
.actions button{flex:1;background:none;color:var(--muted)}
.actions button.on{color:var(--like);font-weight:700}
.cm{margin-top:8px;font-size:15px}.cm b{margin-right:6px}.cm .row{margin-top:8px}
.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs button{flex:1;background:none;color:var(--muted);border-radius:0;padding:14px}
.tabs button.on{color:var(--accent);font-weight:700}
.auth{max-width:380px;margin:0 auto;padding:calc(40px + env(safe-area-inset-top,0px)) 16px 24px}
.auth h1{color:var(--accent);font-size:36px;text-align:center;margin:0 0 4px}
.auth p{text-align:center;color:var(--muted);margin:0 0 20px}
.auth input,.auth button{margin-bottom:10px}
.auth button{width:100%}
.auth .ghost{border:1px solid var(--line)}
.err{color:#d93025;font-size:14px;min-height:20px}
.empty{text-align:center;color:var(--muted);padding:24px}
.person{display:flex;align-items:center;gap:10px;padding:8px 0}.person .name{flex:1;word-break:break-word}.h{font-weight:700;margin-bottom:6px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px}
nav.tabs{z-index:10;background:#000;border-top:1px solid #222;height:calc(56px + env(safe-area-inset-bottom,0px));align-items:stretch}
nav.tabs button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:6px 0;color:#8a8a8a;font-size:11px;font-weight:700;background:none;border-radius:0}
nav.tabs button.on{color:#fff}
nav.tabs svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button.on svg.f{fill:currentColor}
nav.tabs button.on svg .ln{stroke:#000}
nav.tabs #plusb{flex:none;width:72px}
nav.tabs #plusb span{display:inline-flex;width:50px;height:34px;border-radius:10px;align-items:center;justify-content:center;font-size:28px;line-height:1;font-weight:400;color:#000;background:linear-gradient(90deg,#25f4ee 0 14%,#fff 14% 86%,#fe2c55 86%)}
#t-feed{bottom:calc(56px + env(safe-area-inset-bottom,0px))}
#nbub{position:absolute;bottom:calc(100% + 8px);left:calc(62.5% + 27px);transform:translateX(-50%);display:flex;gap:10px;background:#fe2c55;color:#fff;font-size:14px;font-weight:700;border-radius:10px;padding:7px 12px;white-space:nowrap;cursor:pointer}
#nbub::after{content:"";position:absolute;left:50%;bottom:-6px;transform:translateX(-50%);border:6px solid transparent;border-bottom:0;border-top-color:#fe2c55}
body.home{background:#000;overflow:hidden}body.home .bar{display:none}
body.home .tabs{background:#000;border-top-color:#222}body.home .tabs button{color:#999}body.home .tabs button.on{color:#fff}
#t-feed{position:fixed;left:0;right:0;top:0;bottom:calc(54px + env(safe-area-inset-bottom,0px));background:#000;z-index:4}
#reels{height:100%;overflow-y:scroll;scroll-snap-type:y mandatory;overscroll-behavior:contain;scrollbar-width:none}
#reels::-webkit-scrollbar{display:none}
.reel{position:relative;height:100%;scroll-snap-align:start;scroll-snap-stop:always;background:#000;color:#fff;overflow:hidden}
.reel::after{content:"";position:absolute;left:0;right:0;bottom:0;height:35%;background:linear-gradient(transparent,rgba(0,0,0,.55));pointer-events:none}
.rmedia{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.rv{width:100%;height:100%;object-fit:contain;background:#000}
.rtext{padding:32px;font-size:24px;font-weight:700;text-align:center;word-break:break-word;background:linear-gradient(160deg,#1d5fd1,#7b1fa2);color:#fff;width:100%;height:100%;display:flex;align-items:center;justify-content:center}
.rplay{position:absolute;font-size:64px;opacity:.85;display:none;pointer-events:none}.rmedia.paused .rplay{display:block}
.rside{position:absolute;right:8px;bottom:24px;display:flex;flex-direction:column;align-items:center;gap:18px;z-index:2}
.rav{position:relative;margin-bottom:10px;cursor:pointer}.rav .avatar{width:48px;height:48px;border:2px solid #fff}
.rplus{position:absolute;left:50%;bottom:-10px;transform:translateX(-50%);width:22px;height:22px;border-radius:50%;padding:0;background:#fe2c55;color:#fff;font-size:16px;line-height:22px}
.rb{background:none;color:#fff;padding:0;display:flex;flex-direction:column;align-items:center;font-size:13px;text-shadow:0 1px 3px rgba(0,0,0,.8)}
.rb i{font-style:normal;font-size:34px;line-height:1}.rb.on i{color:#fe2c55}
.rinfo{position:absolute;left:12px;right:84px;bottom:24px;z-index:2;text-shadow:0 1px 3px rgba(0,0,0,.9)}
.rinfo b{font-size:17px;cursor:pointer}.rcap{margin-top:6px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word}
#htop{position:absolute;top:0;left:0;right:0;z-index:6;display:flex;align-items:center;justify-content:space-between;padding:calc(10px + env(safe-area-inset-top,0px)) 14px 10px;background:linear-gradient(rgba(0,0,0,.5),transparent)}
#htop>button{background:none;color:#fff;font-size:22px;padding:4px 6px;position:relative}
#hbell b{position:absolute;top:-4px;right:-2px;background:#e0245e;color:#fff;font-size:11px;border-radius:10px;padding:1px 6px}
.htabs{display:flex;gap:18px}.htabs button{background:none;color:rgba(255,255,255,.65);font-size:17px;font-weight:700;padding:4px 2px;border-radius:0}.htabs button.on{color:#fff;box-shadow:inset 0 -2px #fff}
#compose{position:fixed;inset:0;z-index:36;background:var(--bg);overflow-y:auto;padding-top:env(safe-area-inset-top,0px)}
#compose .chh{padding:8px 12px;background:var(--card)}
.tile{position:relative}.tile .pl{position:absolute;left:6px;bottom:6px;color:#fff;font-size:12px;text-shadow:0 1px 3px rgba(0,0,0,.9)}
#svlist{position:absolute;left:0;right:0;bottom:0;max-height:60%;overflow-y:auto;background:var(--card);color:var(--text);border-radius:16px 16px 0 0;padding:12px;z-index:5}
.tabs button[data-a=plus]{flex:none;width:72px;padding:8px 0;background:none}
#plusb span{display:inline-flex;width:54px;height:36px;border-radius:12px;align-items:center;justify-content:center;font-size:26px;line-height:1;color:#fff;background:linear-gradient(90deg,#25f4ee 0 10%,var(--accent) 10% 90%,#fe2c55 90%)}
#plus{position:fixed;inset:0;z-index:35;background:rgba(0,0,0,.5);display:flex;align-items:flex-end}
.sheet{width:100%;background:var(--card);border-radius:16px 16px 0 0;padding:12px 12px calc(12px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px}
.sheet button{padding:14px;font-size:16px}
.ph{display:flex;justify-content:space-between;align-items:center;gap:12px}
.ph .avatar{width:96px;height:96px;font-size:38px;flex:none}
.pname{font-size:24px;font-weight:800;word-break:break-word}
.stats{display:flex;gap:22px;margin:12px 0 4px}.stats b{display:block;font-size:18px}.stats span{font-size:13px;color:var(--muted)}
.ptabs{display:flex;border-bottom:1px solid var(--line);margin-bottom:2px}
.ptabs button{flex:1;background:none;color:var(--muted);border-radius:0;padding:12px}
.ptabs button.on{color:var(--text);box-shadow:inset 0 -2px var(--text)}
.strip{display:flex;gap:12px;overflow-x:auto;padding:4px 2px 12px}
.st{flex:none;width:68px;text-align:center;cursor:pointer;font-size:12px;color:var(--muted)}
.st .ring{width:64px;height:64px;border-radius:50%;padding:3px;background:linear-gradient(45deg,#f9a825,#e0245e,#7b1fa2);margin:0 auto 4px}
.st .ring.seen,.st .ring.add{background:var(--line)}
.st .ring .avatar{width:100%;height:100%;border:2px solid var(--bg)}
.st .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#sv{position:fixed;inset:0;z-index:40;background:#000;color:#fff}
#svbar{position:absolute;top:calc(8px + env(safe-area-inset-top,0px));left:8px;right:8px;display:flex;gap:4px;z-index:3}
#svbar i{flex:1;height:3px;background:rgba(255,255,255,.35);border-radius:2px;overflow:hidden}
#svbar i b{display:block;height:100%;width:0;background:#fff}
.svh{position:absolute;top:calc(20px + env(safe-area-inset-top,0px));left:10px;right:10px;z-index:3;color:#fff;gap:8px}
.svh .avatar{width:32px;height:32px;font-size:14px}.svh .ghost{color:#fff}
#svbody{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
#svbody img,#svbody video{max-width:100%;max-height:100%}
#svl,#svr{position:absolute;top:80px;bottom:0;z-index:2}#svl{left:0;width:35%}#svr{right:0;width:65%}
.tile{position:relative;aspect-ratio:3/4;background:var(--card);overflow:hidden;border:0;padding:0;border-radius:0;color:var(--text)}
.tile img{width:100%;height:100%;object-fit:cover;display:block}
.tile .tt{padding:8px;font-size:13px;text-align:left;word-break:break-word}
.tile .pl{position:absolute;left:6px;bottom:6px;color:#fff;font-size:13px;text-shadow:0 1px 3px #000}
.media{width:100%;max-height:70vh;border-radius:10px;background:#000;display:block;margin:8px 0;object-fit:contain}
.modal{position:fixed;inset:0;z-index:20;background:var(--bg);overflow:auto;padding:calc(8px + env(safe-area-inset-top,0px)) 12px calc(16px + env(safe-area-inset-bottom,0px))}
.prof{text-align:center}.prof .avatar{width:72px;height:72px;font-size:28px;margin:0 auto 8px}.prof button{margin-top:8px}
.notice{background:#fff4ce;color:#5a4500;border-radius:10px;padding:10px;margin-bottom:12px;font-size:14px}
#toast{position:fixed;left:12px;right:12px;bottom:calc(76px + env(safe-area-inset-bottom,0px));background:#222;color:#fff;border-radius:10px;padding:10px 14px;z-index:30;text-align:center}
</style>
</head>
<body class="home">

<section id="auth" class="auth" hidden>
  <h1>Sociafeed</h1>
  <p>Partage avec tes amis.</p>
  <div id="cfg" class="notice" hidden>Colle d’abord la configuration de ton projet Firebase dans le fichier (cherche « firebaseConfig »).</div>
  <input id="nm" placeholder="Ton nom" autocomplete="name" hidden>
  <input id="em" type="email" placeholder="Email" autocomplete="email">
  <input id="pw" type="password" placeholder="Mot de passe (6 caractères minimum)" autocomplete="current-password">
  <div id="err" class="err"></div>
  <button id="go">Se connecter</button>
  <button id="gg" class="ghost">Continuer avec Google</button>
  <button id="sw" class="ghost">Pas de compte ? Créer un compte</button>
</section>

<div id="main" hidden>
  <header class="bar"><span>Sociafeed</span><button id="bell" data-a="notifs">🔔</button></header>
  <main class="wrap">
    <section id="t-feed">
      <div id="htop"><button id="hbell" data-a="hbell">🔔</button><div class="htabs"><button data-a="ftab" data-t="friends">Amis</button><button class="on" data-a="ftab" data-t="all">Pour toi</button></div><button data-a="hsearch">🔍</button></div>
      <div id="reels"></div>
    </section>
    <section id="t-friends" hidden>
      <div class="card">
        <input id="q" placeholder="Chercher une personne par son nom">
        <div id="found"></div>
      </div>
      <div class="card" id="reqcard" hidden><div class="h">Demandes reçues</div><div id="reqs"></div></div>
      <div class="card"><div class="h">Mes amis</div><div id="frs"></div></div>
    </section>
    <section id="t-discover" hidden><div class="h" style="margin:12px 4px 6px">Publications des autres</div><div id="disc"></div></section>
    <section id="t-msgs" hidden><div id="stories" class="strip"></div><input id="sfile" type="file" accept="image/*,video/*" hidden><div class="card"><div class="h">Messages</div><div id="convs"></div></div></section>
    <section id="t-me" hidden>
      <div class="card">
        <div class="ph"><div><div class="pname" id="myname"></div><div class="time" id="myem"></div><div class="bio" id="mybio"></div></div><div id="av" data-a="chphoto" style="cursor:pointer;flex:none"></div></div>
        <div class="stats" id="mystats"></div>
        <div class="row" style="margin-top:12px"><button class="ghost" data-a="chphoto" style="border:1px solid var(--line)">Changer ma photo</button><input id="pfile" type="file" accept="image/*" hidden></div>
        <div class="row" style="margin-top:12px"><input id="newbio" maxlength="120" placeholder="Ma bio (120 caractères)"><button id="savebio">OK</button></div>
        <div class="row" style="margin-top:12px"><input id="newname" placeholder="Changer mon nom"><button id="savename">Enregistrer</button></div>
        <div class="row right"><button id="out" class="ghost">Se déconnecter</button></div>
      </div>
      <div class="ptabs"><button class="on" data-a="ptab" data-t="posts">▦ Publications</button><button data-a="ptab" data-t="likes">♥ J’aime</button></div>
      <div id="mine"></div>
    </section>
  </main>
  <nav class="tabs"><span id="nbub" data-a="notifs" hidden></span><button data-t="feed" class="on"><svg class="f" viewBox="0 0 24 24"><path d="M3 11.5 12 4l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Accueil</button><button data-t="discover"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><circle cx="17.5" cy="17.5" r="3"/><path d="m20 20 2 2"/></svg>Découvrir</button><button id="plusb" data-a="plus"><span>+</span></button><button data-t="msgs"><svg class="f" viewBox="0 0 24 24"><path d="M4 5h16a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1h-6l-4 4v-4H4a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1z"/><path class="ln" d="M8 11h8"/></svg>Messages</button><button data-t="me"><svg class="f" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7z"/></svg>Moi</button></nav>
</div>
<div id="compose" hidden>
  <div class="chh row"><button class="ghost" data-a="cclose">← Retour</button><b>Nouvelle publication</b></div>
  <div class="wrap">
      <div class="card">
        <textarea id="txt" maxlength="2000" placeholder="Quoi de neuf ?"></textarea>
        <input id="file" type="file" accept="image/*,video/*" hidden>
        <div class="row" style="margin-top:8px"><button class="ghost" id="pick" style="border:1px solid var(--line)">📷 Photo ou vidéo</button><span id="fname" class="time" style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap"></span><button id="pub">Publier</button></div>
      </div>
  </div>
</div>
<div id="plus" hidden data-a="pclose"><div class="sheet">
  <button data-a="pnew">Écrire une publication</button>
  <button data-a="pmedia">Publier une photo ou une vidéo</button>
  <button data-a="pstory">Ajouter une story</button>
  <button class="ghost" data-a="pclose">Annuler</button>
</div></div>
<div id="sv" hidden>
  <div id="svbar"></div>
  <div class="svh row"><span id="svav"></span><b id="svname"></b><span class="time" id="svago" style="color:#ccc"></span><span style="flex:1"></span><button class="ghost" id="svv" hidden></button><button class="ghost" id="svdel" hidden>Supprimer</button><button class="ghost" id="svx">✕</button></div>
  <div id="svbody"></div><div id="svl"></div><div id="svr"></div><div id="svlist" hidden></div>
</div>
<div id="chat" hidden>
  <div class="chh row"><button class="ghost" data-a="chback">← Retour</button><b id="chname"></b></div>
  <div id="msgs"></div>
  <div class="chf row"><button class="ghost" id="cpick">+</button><input id="cin" placeholder="Écrire un message…" maxlength="2000"><button id="csend">Envoyer</button><input id="cfile" type="file" accept="image/*,video/*" hidden></div>
</div>
<div id="modal" class="modal" hidden></div>
<div id="toast" hidden></div>

<script type="module">

let me = null, posts = [], open = new Set(), cm = {}, subs = {}, unsubFeed = null, signup = false, tt, fr = [], unsubFr = null, st, pool = {}, userPosts = {}, cur = null, unsubMine = null, file = null, avatars = {}, asked = {}, bios = {}, notifs = [], unsubNotifs = null, chatWith = null, unsubChat = null, cfile = null, stories = [], unsubStories = null, ptab = "posts", sq = [], si = 0, stm = null, ftab = "all", soundOn = true;

const avOk = u => typeof u === "string" && u.startsWith(`https://res.cloudinary.com/${CLOUD}/`);
const avHTML = (uid, name) => avOk(avatars[uid])
  ? `<img class="avatar" src="${esc(avatars[uid])}" alt="">`
  : `<div class="avatar">${esc((name || "?")[0].toUpperCase())}</div>`;
function wantAvatars(uids) {
  uids.filter(u => u && !(u in asked)).forEach(u => {
    asked[u] = 1;
    getDoc(doc(db, "users", u)).then(d => { avatars[u] = d.exists() ? (d.data().photo || "") : ""; bios[u] = d.exists() ? (d.data().bio || "") : ""; render(); }).catch(() => {});
  });
}
const other = f => f.members.find(x => x !== me.uid);
const saveUser = () => setDoc(doc(db, "users", me.uid), { name: nameOf(me), nameLower: nameOf(me).toLowerCase(), ts: Date.now() }, { merge: true }).catch(() => {});
const ago = t => {
  const s = (Date.now() - t) / 1000;
  if (s < 60) return "à l’instant";
  if (s < 3600) return `il y a ${Math.floor(s / 60)} min`;
  if (s < 86400) return `il y a ${Math.floor(s / 3600)} h`;
  return new Date(t).toLocaleDateString("fr-FR");
};
const toast = m => { const t = $("toast"); t.textContent = m; t.hidden = false; clearTimeout(tt); tt = setTimeout(() => t.hidden = true, 3500); };
const denied = e => toast(e.code === "permission-denied" ? "Accès refusé : publie d’abord les règles Firestore." : e.message);

// ---------- Connexion ----------
const errs = {
  "auth/invalid-credential": "Email ou mot de passe incorrect.",
  "auth/invalid-email": "Adresse email invalide.",
  "auth/email-already-in-use": "Cet email est déjà utilisé.",
  "auth/weak-password": "Mot de passe trop court (6 caractères minimum).",
  "auth/unauthorized-domain": "Domaine non autorisé : ajoute-le dans Firebase > Authentication > Paramètres.",
  "auth/network-request-failed": "Pas de connexion internet."
};
const showErr = e => { if (e.code !== "auth/popup-closed-by-user") $("err").textContent = errs[e.code] || e.message; };

$("sw").onclick = () => {
  signup = !signup;
  $("nm").hidden = !signup;
  $("go").textContent = signup ? "Créer mon compte" : "Se connecter";
  $("sw").textContent = signup ? "J’ai déjà un compte" : "Pas de compte ? Créer un compte";
  $("err").textContent = "";
};
$("go").onclick = async () => {
  if (!configured) return;
  $("err").textContent = "";
  try {
    const em = $("em").value.trim(), pw = $("pw").value;
    if (signup) {
      const nm = $("nm").value.trim();
      if (!nm) { $("err").textContent = "Indique ton nom."; return; }
      const c = await createUserWithEmailAndPassword(auth, em, pw);
      await updateProfile(c.user, { displayName: nm });
      me = auth.currentUser; await saveUser(); render();
    } else await signInWithEmailAndPassword(auth, em, pw);
  } catch (e) { showErr(e); }
};
$("gg").onclick = async () => { if (!configured) return; try { await signInWithPopup(auth, new GoogleAuthProvider()); } catch (e) { showErr(e); } };
$("out").onclick = () => signOut(auth);

if (configured) onAuthStateChanged(auth, u => {
  me = u;
  $("auth").hidden = !!u; $("main").hidden = !u;
  if (unsubFeed) { unsubFeed(); unsubFeed = null; }
  if (unsubFr) { unsubFr(); unsubFr = null; }
  if (unsubMine) { unsubMine(); unsubMine = null; }
  if (unsubNotifs) { unsubNotifs(); unsubNotifs = null; }
  if (unsubStories) { unsubStories(); unsubStories = null; }
  closeChat();
  Object.values(subs).forEach(f => f()); subs = {}; open.clear(); cm = {};
  if (!u) { posts = []; fr = []; pool = {}; userPosts = {}; cur = null; notifs = []; stories = []; $("modal").hidden = true; return; }
  saveUser();
  unsubFeed = onSnapshot(query(collection(db, "posts"), orderBy("ts", "desc"), limit(100)),
    s => { posts = s.docs.map(d => pool[d.id] = { id: d.id, ...d.data() }); render(); }, denied);
  unsubMine = onSnapshot(query(collection(db, "posts"), where("uid", "==", u.uid)),
    s => { userPosts[u.uid] = s.docs.map(d => pool[d.id] = { id: d.id, ...d.data() }); render(); }, denied);
  unsubStories = onSnapshot(query(collection(db, "stories"), where("ts", ">", Date.now() - 864e5), orderBy("ts")),
    s => { stories = s.docs.map(d => ({ id: d.id, ...d.data() })); render(); }, () => {});
  unsubNotifs = onSnapshot(query(collection(db, "users", u.uid, "notifs"), orderBy("ts", "desc"), limit(40)),
    s => { notifs = s.docs.map(d => ({ id: d.id, ...d.data() })); render(); }, () => {});
  unsubFr = onSnapshot(query(collection(db, "friendships"), where("members", "array-contains", u.uid)),
    s => { fr = s.docs.map(d => ({ id: d.id, ...d.data() })); render(); }, denied);
  render();
});
else $("auth").hidden = false;

// ---------- Affichage ----------
const thumb = p => !p.media ? "" : p.mtype === "video"
  ? p.media.replace("/upload/", "/upload/so_0,w_400,h_533,c_fill,q_auto/").replace(/\.\w+$/, ".jpg")
  : p.media.replace("/upload/", "/upload/w_400,h_533,c_fill,q_auto/");
const mediaHTML = p => !p.media ? "" : p.mtype === "video"
  ? `<video class="media" src="${esc(p.media)}" controls playsinline preload="metadata"></video>`
  : `<img class="media" src="${esc(p.media.replace("/upload/", "/upload/q_auto,w_900/"))}" loading="lazy" alt="">`;
const tile = p => `<button class="tile" data-a="open" data-id="${p.id}">${thumb(p) ? `<img src="${esc(thumb(p))}" loading="lazy" alt="">` : `<div class="tt">${esc((p.text || "").slice(0, 90))}</div>`}<span class="pl">${p.mtype === "video" ? "▶ " : "👁 "}${vcount(p)}</span></button>`;
const gridHTML = list => list.length ? `<div class="grid">${list.slice().sort((a, b) => b.ts - a.ts).map(tile).join("")}</div>` : `<div class="empty">Aucune publication.</div>`;

const vcount = p => Object.keys(p.viewers || {}).length;
const viewed = new Set();
function markView(id) {
  const q = pool[id];
  if (!q || !me || q.uid === me.uid || viewed.has(id) || (q.viewers || {})[me.uid]) return;
  viewed.add(id);
  updateDoc(doc(db, "posts", id), { ["viewers." + me.uid]: true }).catch(() => {});
}
const io = "IntersectionObserver" in window ? new IntersectionObserver(es => es.forEach(en => { if (en.isIntersecting) markView(en.target.dataset.pv); }), { threshold: 0.4 }) : null;
const statsHTML = (list, own) => `<div><b>${list.length}</b><span>Publications</span></div><div><b>${list.reduce((n, p) => n + (p.likes || []).length, 0)}</b><span>J’aime</span></div><div><b>${list.reduce((n, p) => n + vcount(p), 0)}</b><span>Vues</span></div>${own ? `<div><b>${fr.filter(f => f.status === "accepted").length}</b><span>Amis</span></div>` : ""}`;
function profileHTML(uid, name) {
  const list = userPosts[uid] || [], own = uid === me.uid;
  const btn = own ? `<button class="ghost" data-a="chphoto">Changer ma photo</button>`
    : fr.some(f => other(f) === uid && f.status === "accepted") ? `<button data-a="chat" data-u="${uid}" data-n="${esc(name)}">Message</button>`
    : fr.some(f => other(f) === uid) ? `<span class="time">Demande en attente</span>`
    : `<button data-a="add" data-u="${uid}" data-n="${esc(name)}">Ajouter en ami</button>`;
  return `<div class="card"><div class="ph"><div><div class="pname">${esc(name)}</div>${bios[uid] ? `<div class="bio">${esc(bios[uid])}</div>` : ""}</div>${avHTML(uid, name)}</div><div class="stats">${statsHTML(list, own)}</div><div style="margin-top:10px">${btn}</div></div>${gridHTML(list)}`;
}

function paintModal() {
  const m = $("modal");
  if (!cur) { m.hidden = true; m.innerHTML = ""; return; }
  const sc = m.scrollTop;
  m.hidden = false;
  m.innerHTML = `<button class="ghost" data-a="back">← Retour</button>` + (cur.t === "post"
    ? (pool[cur.id] ? postHTML(pool[cur.id]) : `<div class="empty">Publication introuvable.</div>`)
    : cur.t === "notifs" ? notifsHTML() : profileHTML(cur.uid, cur.name));
  m.scrollTop = sc;
}

function postHTML(p) {
  const likes = p.likes || [], liked = likes.includes(me.uid);
  const comments = open.has(p.id)
    ? `<div class="cm">${(cm[p.id] || []).map(c => `<div><b>${esc(c.name)}</b>${esc(c.text)}</div>`).join("")}<div class="row"><input data-ci="${p.id}" maxlength="1000" placeholder="Écrire un commentaire…"><button data-a="send" data-id="${p.id}">Envoyer</button></div></div>`
    : "";
  return `<article class="card" data-pv="${p.id}"><div class="row"><div class="row" style="flex:1;cursor:pointer" data-a="prof" data-u="${p.uid}" data-n="${esc(p.name)}">${avHTML(p.uid, p.name)}<div><div class="name">${esc(p.name)}</div><div class="time">${ago(p.ts)}</div></div></div>${p.uid === me.uid ? `<button class="ghost" data-a="del" data-id="${p.id}">Supprimer</button>` : ""}</div>${p.text ? `<div class="text">${esc(p.text)}</div>` : ""}${mediaHTML(p)}<div class="time">${likes.length ? "♥ " + likes.length : ""}${likes.length && vcount(p) ? " · " : ""}${vcount(p) ? "👁 " + vcount(p) : ""}</div><div class="actions"><button data-a="like" data-id="${p.id}" class="${liked ? "on" : ""}">${liked ? "♥" : "♡"} J’aime</button><button data-a="cm" data-id="${p.id}">Commenter</button></div>${comments}</article>`;
}

function renderFriends() {
  const acc = fr.filter(f => f.status === "accepted");
  const req = fr.filter(f => f.status === "pending" && f.requester !== me.uid);
  const sent = fr.filter(f => f.status === "pending" && f.requester === me.uid);
  const nm = f => (f.names || {})[other(f)] || "Utilisateur";
  const row = (f, btns) => `<div class="person" data-a="prof" data-u="${other(f)}" data-n="${esc(nm(f))}" style="cursor:pointer">${avHTML(other(f), nm(f))}<div class="name">${esc(nm(f))}</div>${btns}</div>`;
  $("reqcard").hidden = !req.length;
  $("reqs").innerHTML = req.map(f => row(f, `<button data-a="acc" data-id="${f.id}">Accepter</button><button class="ghost" data-a="rm" data-id="${f.id}">Refuser</button>`)).join("");
  $("frs").innerHTML = acc.length || sent.length
    ? acc.map(f => row(f, `<button data-a="chat" data-u="${other(f)}" data-n="${esc(nm(f))}">Message</button><button class="ghost" data-a="rm" data-id="${f.id}">Retirer</button>`)).join("")
      + sent.map(f => row(f, `<span class="time">Demande envoyée</span><button class="ghost" data-a="rm" data-id="${f.id}">Annuler</button>`)).join("")
    : `<div class="empty">Pas encore d’amis. Cherche quelqu’un ci-dessus.</div>`;
}

function render() {
  if (!me) return;
  wantAvatars([me.uid, ...posts.map(p => p.uid), ...fr.map(other), ...Object.keys(userPosts), ...stories.map(x => x.uid)]);
  const keep = {};
  document.querySelectorAll("[data-ci]").forEach(i => keep[i.dataset.ci] = i.value);
  const f = document.activeElement && document.activeElement.dataset ? document.activeElement.dataset.ci : null;

  const ok = new Set([me.uid, ...fr.filter(f => f.status === "accepted").map(other)]);
  const feed = posts.filter(p => ok.has(p.uid));
  renderReels();
  renderFriends();
  $("mine").innerHTML = gridHTML(ptab === "likes" ? Object.values(pool).filter(p => (p.likes || []).includes(me.uid)).sort((a, b) => b.ts - a.ts) : userPosts[me.uid] || []);
  $("mystats").innerHTML = statsHTML(userPosts[me.uid] || [], true);
  $("disc").innerHTML = posts.some(p => p.media) ? gridHTML(posts.filter(p => p.media)) : `<div class="empty">Aucune photo ou vidéo pour l’instant.</div>`;
  const nn = notifs.filter(n => !n.read).length;
  $("bell").innerHTML = "🔔" + (nn ? `<b>${nn}</b>` : "");
  $("hbell").innerHTML = "🔔" + (nn ? `<b>${nn}</b>` : "");
  const nk = [["like", "♥"], ["comment", "💬"], ["friend", "👤"]].map(([t, i]) => [i, notifs.filter(n => !n.read && n.type === t).length]).filter(x => x[1]);
  $("nbub").hidden = !nk.length;
  $("nbub").innerHTML = nk.map(x => `<span>${x[0]} ${x[1]}</span>`).join("");
  $("mybio").textContent = bios[me.uid] || "";
  renderStories(); paintViews();
  const cf = fr.filter(f => f.status === "accepted"), cn = f => (f.names || {})[other(f)] || "Ami";
  $("convs").innerHTML = cf.length
    ? cf.map(f => `<div class="person" data-a="chat" data-u="${other(f)}" data-n="${esc(cn(f))}" style="cursor:pointer">${avHTML(other(f), cn(f))}<div class="name">${esc(cn(f))}<div class="time">Envoyer un message</div></div></div>`).join("")
    : `<div class="empty">Ajoute des amis pour discuter avec eux.</div>`;
  paintModal();
  $("av").innerHTML = avHTML(me.uid, nameOf(me));
  $("myname").textContent = nameOf(me);
  $("myem").textContent = me.email || "";

  const inputs = [...document.querySelectorAll("[data-ci]")];
  inputs.forEach(i => { if (keep[i.dataset.ci] != null) i.value = keep[i.dataset.ci]; });
  const el = f && inputs.slice().reverse().find(i => i.dataset.ci === f && i.offsetParent);
  if (el) el.focus();
  if (io) document.querySelectorAll("[data-pv]").forEach(x => io.observe(x));
}

// ---------- Actions ----------
document.addEventListener("click", async e => {
  const b = e.target.closest("[data-a]");
  if (!b || !me) return;
  const id = b.dataset.id, p = pool[id];
  try {
    if (b.dataset.a === "like" && p) {
      const had = (p.likes || []).includes(me.uid);
      p.likes = had ? p.likes.filter(x => x !== me.uid) : [...(p.likes || []), me.uid];
      render();
      await updateDoc(doc(db, "posts", id), { likes: had ? arrayRemove(me.uid) : arrayUnion(me.uid) });
      if (!had) notify(p.uid, "like", { postId: id });
    } else if (b.dataset.a === "del") {
      if (confirm("Supprimer cette publication ?")) {
        await deleteDoc(doc(db, "posts", id));
        if (cur && cur.t === "post" && cur.id === id) history.back();
      }
    } else if (b.dataset.a === "open") {
      history.pushState({}, ""); cur = { t: "post", id, prev: cur }; render();
    } else if (b.dataset.a === "prof") {
      const uid = b.dataset.u;
      if (uid !== me.uid && !userPosts[uid]) {
        const sn = await getDocs(query(collection(db, "posts"), where("uid", "==", uid)));
        userPosts[uid] = sn.docs.map(d => pool[d.id] = { id: d.id, ...d.data() });
      }
      history.pushState({}, ""); cur = { t: "user", uid, name: b.dataset.n, prev: cur }; render();
    } else if (b.dataset.a === "chat") {
      openChat(b.dataset.u, b.dataset.n);
    } else if (b.dataset.a === "chback") {
      history.back();
    } else if (b.dataset.a === "notifs") {
      history.pushState({}, ""); cur = { t: "notifs", prev: cur }; render();
      notifs.filter(n => !n.read).forEach(n => updateDoc(doc(db, "users", me.uid, "notifs", n.id), { read: true }).catch(() => {}));
    } else if (b.dataset.a === "hbell") {
      $("bell").click();
    } else if (b.dataset.a === "hsearch") {
      showTab("discover"); setTimeout(() => $("q").focus(), 60);
    } else if (b.dataset.a === "cclose") {
      history.back();
    } else if (b.dataset.a === "rtap") {
      const v = b.querySelector("video");
      if (v) { soundOn = true; v.muted = false; if (v.paused) { v.play().catch(() => {}); b.classList.remove("paused"); } else { v.pause(); b.classList.add("paused"); } }
    } else if (b.dataset.a === "rcm") {
      history.pushState({}, ""); cur = { t: "post", id, prev: cur }; openComments(id); render();
    } else if (b.dataset.a === "share") {
      const link = location.origin + location.pathname;
      if (navigator.share) navigator.share({ title: "Sociafeed", text: p && p.text ? p.text.slice(0, 80) : "Regarde cette publication", url: link }).catch(() => {});
      else { if (navigator.clipboard) navigator.clipboard.writeText(link).catch(() => {}); toast("Lien copié."); }
    } else if (b.dataset.a === "plus") {
      $("plus").hidden = false;
    } else if (b.dataset.a === "pclose") {
      $("plus").hidden = true;
    } else if (b.dataset.a === "pnew") {
      $("plus").hidden = true; openCompose();
    } else if (b.dataset.a === "pmedia") {
      $("plus").hidden = true; openCompose(); $("file").click();
    } else if (b.dataset.a === "pstory") {
      $("plus").hidden = true; $("sfile").click();
    } else if (b.dataset.a === "ftab") {
      ftab = b.dataset.t;
      document.querySelectorAll("#htop .htabs button").forEach(x => x.classList.toggle("on", x === b));
      $("reels").scrollTop = 0; renderReels();
    } else if (b.dataset.a === "ptab") {
      ptab = b.dataset.t;
      document.querySelectorAll(".ptabs button").forEach(x => x.classList.toggle("on", x === b));
      render();
    } else if (b.dataset.a === "addstory") {
      $("sfile").click();
    } else if (b.dataset.a === "story") {
      openStory(b.dataset.u);
    } else if (b.dataset.a === "chphoto") {
      $("pfile").click();
    } else if (b.dataset.a === "back") {
      history.back();
    } else if (b.dataset.a === "cm") {
      if (open.has(id)) { open.delete(id); if (subs[id]) subs[id](); delete subs[id]; }
      else {
        open.add(id);
        subs[id] = onSnapshot(query(collection(db, "posts", id, "comments"), orderBy("ts")), s => { cm[id] = s.docs.map(d => d.data()); render(); }, denied);
      }
      render();
    } else if (b.dataset.a === "add") {
      const u = b.dataset.u, ids = [me.uid, u].sort();
      await setDoc(doc(db, "friendships", ids.join("_")), { members: ids, requester: me.uid, status: "pending", names: { [me.uid]: nameOf(me), [u]: b.dataset.n }, ts: Date.now() });
      notify(u, "friend"); toast("Demande envoyée.");
      b.outerHTML = `<span class="time">Demande envoyée</span>`;
    } else if (b.dataset.a === "acc") {
      await updateDoc(doc(db, "friendships", id), { status: "accepted" });
    } else if (b.dataset.a === "rm") {
      if (confirm("Confirmer ?")) await deleteDoc(doc(db, "friendships", id));
    } else if (b.dataset.a === "send") {
      const i = b.closest(".cm").querySelector("input"), t = i.value.trim();
      if (!t) return;
      i.value = "";
      await addDoc(collection(db, "posts", id, "comments"), { uid: me.uid, name: nameOf(me), text: t, ts: Date.now() });
      notify(pool[id] && pool[id].uid, "comment", { postId: id });
    }
  } catch (x) { denied(x); }
});

window.addEventListener("popstate", () => { if (chatWith) { closeChat(); return; } if (!$("sv").hidden) { closeStory(); return; } if (!$("compose").hidden) { closeCompose(); return; } cur = cur ? cur.prev || null : null; render(); });

document.addEventListener("keydown", e => {
  if (e.key === "Enter" && e.target.dataset && e.target.dataset.ci) e.target.closest(".cm").querySelector("button").click();
});

$("pfile").onchange = async () => {
  const f = $("pfile").files[0]; $("pfile").value = "";
  if (!f || !me) return;
  if (!f.type.startsWith("image/")) { toast("Choisis une photo."); return; }
  if (f.size > 15 * 1048576) { toast("Photo trop lourde (15 Mo maximum)."); return; }
  toast("Envoi de la photo…");
  try {
    const r = await upload(f);
    const url = r.media.replace("/upload/", "/upload/w_240,h_240,c_fill,g_face,q_auto,f_auto/");
    await setDoc(doc(db, "users", me.uid), { photo: url }, { merge: true });
    avatars[me.uid] = url; render(); toast("Photo de profil mise à jour.");
  } catch (e) { toast(e.message); }
};

const notify = (to, type, extra = {}) => {
  if (to && to !== me.uid) addDoc(collection(db, "users", to, "notifs"), { from: me.uid, name: nameOf(me), type, ts: Date.now(), read: false, ...extra }).catch(() => {});
};
const nText = n => ({ like: "a aimé ta publication", comment: "a commenté ta publication", friend: "t’a envoyé une demande d’ami" }[n.type] || "");
function notifsHTML() {
  return `<div class="card"><div class="h">Notifications</div>${notifs.length ? notifs.map(n => `<div class="person" data-a="${n.postId ? "open" : "prof"}" data-id="${n.postId || ""}" data-u="${n.from}" data-n="${esc(n.name)}" style="cursor:pointer">${avHTML(n.from, n.name)}<div class="name"><b>${esc(n.name)}</b> ${nText(n)}<div class="time">${ago(n.ts)}</div></div>${n.read ? "" : `<span style="color:var(--accent)">●</span>`}</div>`).join("") : `<div class="empty">Aucune notification.</div>`}</div>`;
}

const msgHTML = m => `<div class="msg${m.from === me.uid ? " me" : ""}">${avOk(m.media) ? (m.mtype === "video" ? `<video src="${esc(m.media)}" controls playsinline preload="metadata"></video>` : `<img src="${esc(m.media.replace("/upload/", "/upload/q_auto,w_600/"))}" alt="">`) : ""}${m.text ? esc(m.text) : ""}</div>`;
function openChat(uid, name) {
  closeChat();
  chatWith = { uid, name, id: [me.uid, uid].sort().join("_") };
  $("chname").textContent = name; $("chat").hidden = false; $("msgs").innerHTML = "";
  history.pushState({}, "");
  unsubChat = onSnapshot(query(collection(db, "chats", chatWith.id, "messages"), orderBy("ts", "desc"), limit(100)), s => {
    const box = $("msgs"), near = box.scrollHeight - box.scrollTop - box.clientHeight < 150;
    box.innerHTML = s.docs.length ? s.docs.slice().reverse().map(d => msgHTML(d.data())).join("") : `<div class="empty">Dis bonjour !</div>`;
    if (near) box.scrollTop = box.scrollHeight;
  }, denied);
  setTimeout(() => { $("msgs").scrollTop = $("msgs").scrollHeight; }, 400);
}
function closeChat() {
  if (unsubChat) unsubChat();
  unsubChat = null; chatWith = null; cfile = null;
  $("chat").hidden = true; $("cpick").textContent = "+";
}
async function sendMsg() {
  if (!chatWith) return;
  const t = $("cin").value.trim();
  if (!t && !cfile) return;
  $("csend").disabled = true;
  try {
    const m = cfile ? await upload(cfile) : {};
    $("cin").value = ""; cfile = null; $("cpick").textContent = "+";
    await addDoc(collection(db, "chats", chatWith.id, "messages"), { from: me.uid, text: t, ts: Date.now(), ...m });
  } catch (e) { denied(e); }
  $("csend").disabled = false;
}
$("csend").onclick = sendMsg;
$("cin").onkeydown = e => { if (e.key === "Enter") sendMsg(); };
$("cpick").onclick = () => $("cfile").click();
$("cfile").onchange = () => {
  const f = $("cfile").files[0]; $("cfile").value = "";
  if (!f) return;
  if (f.size > 80 * 1048576) { toast("Fichier trop lourd (80 Mo maximum)."); return; }
  cfile = f; $("cpick").textContent = "✓";
};

$("savebio").onclick = async () => {
  const v = $("newbio").value.trim().slice(0, 120);
  try { await setDoc(doc(db, "users", me.uid), { bio: v }, { merge: true }); bios[me.uid] = v; $("newbio").value = ""; render(); toast("Bio enregistrée."); }
  catch (e) { toast(e.message); }
};

const seenKey = "sociafeed_seen";
const seen = () => { try { return new Set(JSON.parse(localStorage.getItem(seenKey) || "[]")); } catch (e) { return new Set(); } };
const markSeen = id => { try { const z = seen(); z.add(id); localStorage.setItem(seenKey, JSON.stringify([...z].slice(-300))); } catch (e) {} };
function storyGroups() {
  const ok = new Set([me.uid, ...fr.filter(f => f.status === "accepted").map(other)]), g = {};
  stories.filter(x => ok.has(x.uid) && avOk(x.media) && x.ts > Date.now() - 864e5).forEach(x => (g[x.uid] = g[x.uid] || []).push(x));
  Object.values(g).forEach(a => a.sort((m, n) => m.ts - n.ts));
  return g;
}
function renderStories() {
  const g = storyGroups(), sn = seen(), mine = g[me.uid];
  let h = `<div class="st" data-a="${mine ? "story" : "addstory"}" data-u="${me.uid}"><div class="ring${mine ? (mine.every(x => sn.has(x.id)) ? " seen" : "") : " add"}">${avHTML(me.uid, nameOf(me))}</div><div class="nm">Ta story</div></div>`;
  h += `<div class="st" data-a="addstory"><div class="ring add" style="display:flex;align-items:center;justify-content:center;font-size:28px;color:var(--text)">+</div><div class="nm">Ajouter</div></div>`;
  Object.keys(g).filter(u => u !== me.uid).forEach(u => {
    h += `<div class="st" data-a="story" data-u="${u}"><div class="ring${g[u].every(x => sn.has(x.id)) ? " seen" : ""}">${avHTML(u, g[u][0].name)}</div><div class="nm">${esc(g[u][0].name)}</div></div>`;
  });
  $("stories").innerHTML = h;
}
function openStory(uid) {
  const g = storyGroups()[uid];
  if (!g) return;
  const sn = seen(); sq = g; si = Math.max(0, g.findIndex(x => !sn.has(x.id)));
  $("sv").hidden = false; history.pushState({}, ""); showStory();
}
function showStory() {
  clearTimeout(stm);
  const x = sq[si];
  if (!x) { history.back(); return; }
  markSeen(x.id);
  if (x.uid !== me.uid && !(x.seenBy || {})[me.uid]) updateDoc(doc(db, "stories", x.id), { ["seenBy." + me.uid]: nameOf(me) }).catch(() => {});
  $("svbar").innerHTML = sq.map((_, k) => `<i><b style="width:${k < si ? 100 : 0}%"></b></i>`).join("");
  const bar = $("svbar").children[si].firstChild;
  $("svname").textContent = x.name; $("svav").innerHTML = avHTML(x.uid, x.name); $("svago").textContent = ago(x.ts);
  $("svdel").hidden = x.uid !== me.uid;
  if (x.mtype === "video") {
    $("svbody").innerHTML = `<video src="${esc(x.media)}" autoplay playsinline></video>`;
    const v = $("svbody").firstChild;
    v.onended = nextStory;
    v.ontimeupdate = () => { if (v.duration) bar.style.width = (v.currentTime / v.duration * 100) + "%"; };
  } else {
    $("svbody").innerHTML = `<img src="${esc(x.media.replace("/upload/", "/upload/q_auto,w_900/"))}" alt="">`;
    requestAnimationFrame(() => requestAnimationFrame(() => { bar.style.transition = "width 5s linear"; bar.style.width = "100%"; }));
    stm = setTimeout(nextStory, 5000);
  }
  renderStories(); paintViews();
}
const nextStory = () => { si++; showStory(); };
function closeStory() { clearTimeout(stm); $("sv").hidden = true; $("svlist").hidden = true; $("svbody").innerHTML = ""; }
function paintViews() {
  if ($("sv").hidden || !sq[si]) return;
  const x = stories.find(t => t.id === sq[si].id) || sq[si];
  const list = Object.entries(x.seenBy || {});
  $("svv").hidden = x.uid !== me.uid;
  $("svv").textContent = "👁 " + list.length;
  if (!$("svlist").hidden) {
    $("svlist").innerHTML = `<div class="h">Vu par ${list.length}</div>` + (list.length ? list.map(([u, n]) => `<div class="person">${avHTML(u, n)}<div class="name">${esc(n)}</div></div>`).join("") : `<div class="empty">Personne n’a encore vu ta story.</div>`) + `<button class="ghost" id="svlc">Fermer</button>`;
  }
}
$("svv").onclick = () => {
  clearTimeout(stm);
  const v = $("svbody").querySelector("video"); if (v) v.pause();
  $("svlist").hidden = false; paintViews();
};
$("svlist").onclick = e => { if (e.target.id === "svlc") { $("svlist").hidden = true; showStory(); } };
$("svr").onclick = nextStory;
$("svl").onclick = () => { if (si > 0) si--; showStory(); };
$("svx").onclick = () => history.back();
$("svdel").onclick = () => {
  if (!confirm("Supprimer cette story ?")) return;
  deleteDoc(doc(db, "stories", sq[si].id)).catch(denied);
  history.back();
};
$("sfile").onchange = async () => {
  const f = $("sfile").files[0]; $("sfile").value = "";
  if (!f || !me) return;
  if (!/^(image|video)\//.test(f.type)) { toast("Choisis une photo ou une vidéo."); return; }
  if (f.size > 80 * 1048576) { toast("Fichier trop lourd (80 Mo maximum)."); return; }
  toast("Envoi de ta story…");
  try {
    const m = await upload(f);
    await addDoc(collection(db, "stories"), { uid: me.uid, name: nameOf(me), ts: Date.now(), ...m });
    toast("Story publiée.");
  } catch (e) { toast(e.message); }
};

function openCompose() { $("compose").hidden = false; history.pushState({}, ""); }
function closeCompose() { $("compose").hidden = true; }
function openComments(id) {
  if (open.has(id)) return;
  open.add(id);
  subs[id] = onSnapshot(query(collection(db, "posts", id, "comments"), orderBy("ts")), s => { cm[id] = s.docs.map(d => d.data()); render(); }, denied);
}
const rio = "IntersectionObserver" in window ? new IntersectionObserver(es => es.forEach(en => {
  const v = en.target.querySelector("video");
  if (!v) return;
  if (en.isIntersecting && !$("t-feed").hidden) {
    v.muted = !soundOn;
    const pr = v.play();
    if (pr && pr.catch) pr.catch(() => { v.muted = true; v.play().catch(() => {}); });
    en.target.querySelector(".rmedia").classList.remove("paused");
  } else v.pause();
}), { threshold: 0.7 }) : null;
function reelHTML(p) {
  const ok = avOk(p.media), vid = ok && p.mtype === "video";
  const media = vid ? `<video class="rv" src="${esc(p.media.replace(/\.[a-z0-9]+$/i, ".mp4"))}" poster="${esc(thumb(p))}" loop playsinline preload="metadata"></video><div class="rplay">▶</div>`
    : ok ? `<img class="rv" src="${esc(p.media.replace("/upload/", "/upload/q_auto,w_900,f_auto/"))}" alt="">`
    : `<div class="rtext">${esc(p.text)}</div>`;
  const rel = fr.some(f => other(f) === p.uid);
  return `<section class="reel" data-id="${p.id}" data-pv="${p.id}"><div class="rmedia" data-a="rtap">${media}</div>
  <div class="rside">
    <div class="rav" data-a="prof" data-u="${p.uid}" data-n="${esc(p.name)}">${avHTML(p.uid, p.name)}${p.uid !== me.uid && !rel ? `<button class="rplus" data-a="add" data-u="${p.uid}" data-n="${esc(p.name)}">+</button>` : ""}</div>
    <button class="rb lk" data-a="like" data-id="${p.id}"><i>♥</i><span></span></button>
    <button class="rb" data-a="rcm" data-id="${p.id}"><i>💬</i><span></span></button>
    <button class="rb" data-a="share" data-id="${p.id}"><i>↗</i><span></span></button>
  </div>
  <div class="rinfo"><b data-a="prof" data-u="${p.uid}" data-n="${esc(p.name)}">${esc(p.name)}</b>${ok && p.text ? `<div class="rcap">${esc(p.text)}</div>` : ""}<div class="time" style="color:#ddd">${ago(p.ts)}</div></div></section>`;
}
function updateReel(el, p) {
  const likes = p.likes || [], b = el.querySelector(".lk");
  b.classList.toggle("on", likes.includes(me.uid));
  b.lastChild.textContent = likes.length || "";
  const pl = el.querySelector(".rplus");
  if (pl && fr.some(f => other(f) === p.uid)) pl.remove();
}
function renderReels() {
  const box = $("reels");
  if (!box || !me) return;
  const fs = new Set([me.uid, ...fr.filter(f => f.status === "accepted").map(other)]);
  const list = posts.filter(x => ftab === "all" || fs.has(x.uid)).slice(0, 60);
  const have = {};
  [...box.children].forEach(el => { if (el.dataset.id) have[el.dataset.id] = el; else el.remove(); });
  const ids = new Set(list.map(x => x.id));
  Object.keys(have).forEach(id => { if (!ids.has(id)) have[id].remove(); });
  let prev = null;
  list.forEach(x => {
    let el = have[x.id];
    if (!el || !el.isConnected) {
      const t = document.createElement("div"); t.innerHTML = reelHTML(x); el = t.firstElementChild;
      prev ? prev.after(el) : box.prepend(el);
      const m = el.querySelector("video, img.rv");
      if (m) { const f = () => { const w = m.videoWidth || m.naturalWidth, h = m.videoHeight || m.naturalHeight; if (w && h) m.style.objectFit = h > w * 1.2 ? "cover" : "contain"; }; m.onloadedmetadata = f; m.onload = f; }
      if (rio) rio.observe(el);
    }
    updateReel(el, x);
    prev = el;
  });
  if (!list.length) box.innerHTML = `<div class="reel"><div class="rtext">${ftab === "friends" ? "Ajoute des amis pour voir leurs publications." : "Aucune publication pour l’instant."}</div></div>`;
}

$("pick").onclick = () => $("file").click();
$("file").onchange = () => {
  const f = $("file").files[0];
  if (!f) return;
  if (f.size > 80 * 1024 * 1024) { toast("Fichier trop lourd (80 Mo maximum)."); $("file").value = ""; return; }
  file = f; $("fname").textContent = f.name;
};

async function upload(f) {
  let last = "Échec de l’envoi.";
  for (const pr of PRESETS) {
    const fd = new FormData();
    fd.append("file", f); fd.append("upload_preset", pr);
    const r = await fetch(`https://api.cloudinary.com/v1_1/${CLOUD}/auto/upload`, { method: "POST", body: fd });
    const j = await r.json();
    if (r.ok && j.secure_url) return { media: j.secure_url, mtype: j.resource_type === "video" ? "video" : "image" };
    last = (j.error && j.error.message) || last;
    if (!/preset/i.test(last)) break;
  }
  throw new Error(last);
}

$("pub").onclick = async () => {
  const t = $("txt").value.trim();
  if ((!t && !file) || !me) return;
  $("pub").disabled = true; $("pub").textContent = file ? "Envoi…" : "Publier";
  try {
    const m = file ? await upload(file) : {};
    await addDoc(collection(db, "posts"), { uid: me.uid, name: nameOf(me), text: t, ts: Date.now(), likes: [], ...m });
    $("txt").value = ""; file = null; $("file").value = ""; $("fname").textContent = "";
    if (!$("compose").hidden) history.back();
  } catch (e) { denied(e); }
  $("pub").disabled = false; $("pub").textContent = "Publier";
};

$("savename").onclick = async () => {
  const n = $("newname").value.trim();
  if (!n || !me) return;
  try { await updateProfile(auth.currentUser, { displayName: n }); me = auth.currentUser; await saveUser(); $("newname").value = ""; render(); toast("Nom enregistré."); }
  catch (e) { toast(e.message); }
};

$("q").oninput = () => {
  clearTimeout(st);
  st = setTimeout(async () => {
    const t = $("q").value.trim().toLowerCase();
    if (t.length < 2 || !me) { $("found").innerHTML = ""; return; }
    try {
      const s = await getDocs(query(collection(db, "users"), orderBy("nameLower"), startAt(t), endAt(t + "\uf8ff"), limit(10)));
      const rel = new Set(fr.map(other));
      s.docs.forEach(d => { avatars[d.id] = d.data().photo || ""; bios[d.id] = d.data().bio || ""; asked[d.id] = 1; });
      const list = s.docs.map(d => ({ uid: d.id, ...d.data() })).filter(u => u.uid !== me.uid);
      $("found").innerHTML = list.length
        ? list.map(u => `<div class="person" data-a="prof" data-u="${u.uid}" data-n="${esc(u.name)}" style="cursor:pointer">${avHTML(u.uid, u.name)}<div class="name">${esc(u.name)}</div>${rel.has(u.uid) ? `<span class="time">Déjà en contact</span>` : `<button data-a="add" data-u="${u.uid}" data-n="${esc(u.name)}">Ajouter</button>`}</div>`).join("")
        : `<div class="empty">Aucun résultat.</div>`;
    } catch (e) { denied(e); }
  }, 300);
};

function showTab(k) {
  const vis = { feed: ["feed"], discover: ["friends", "discover"], msgs: ["msgs"], me: ["me"] }[k] || ["feed"];
  document.querySelectorAll(".tabs button[data-t]").forEach(x => x.classList.toggle("on", x.dataset.t === k));
  ["feed", "discover", "friends", "msgs", "me"].forEach(j => $("t-" + j).hidden = !vis.includes(j));
  document.body.classList.toggle("home", k === "feed");
  if (k !== "feed") document.querySelectorAll("#reels video").forEach(v => v.pause());
  window.scrollTo(0, 0);
}
document.querySelectorAll(".tabs button[data-t]").forEach(b => b.onclick = () => { showTab(b.dataset.t); });

if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
